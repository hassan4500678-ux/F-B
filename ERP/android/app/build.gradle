plugins {
    id 'com.android.application'
}

// GitHub passes its run number so every new APK has a higher version.
def vCode = project.hasProperty('vCode') ? project.property('vCode').toString().toInteger() : 1

android {
    namespace 'com.fb.erp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fb.erp'
        minSdk 21
        targetSdk 36
        versionCode vCode
        versionName "1." + vCode
    }

    // Fixed signing key so each update installs over the old app and keeps data.
    // Never delete or replace keystore/fb-erp.jks.
    signingConfigs {
        release {
            storeFile file('../keystore/fb-erp.jks')
            storePassword 'FBERP2026'
            keyAlias 'fberp'
            keyPassword 'FBERP2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    // direct = APK from GitHub with in-app updater
    // play   = bundle for Google Play (updates come from Play Store)
    flavorDimensions 'dist'
    productFlavors {
        direct { dimension 'dist' }
        play { dimension 'dist' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
