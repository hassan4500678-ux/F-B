name: Build FB ERP APK

on:
  push:
    branches: [main]
    paths:
      - 'ERP/**'
      - '.github/workflows/erp-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Put the ERP page inside the app
        run: cp ERP/web/index.html ERP/android/app/src/main/assets/index.html

      - name: Build
        working-directory: ERP/android
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Rename and write version file
        run: |
          cp ERP/android/app/build/outputs/apk/direct/release/app-direct-release.apk FB-ERP.apk
          cp ERP/android/app/build/outputs/bundle/playRelease/app-play-release.aab FB-ERP-play.aab
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.${{ github.run_number }}"}' > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: FB-ERP-APK
          path: |
            FB-ERP.apk
            FB-ERP-play.aab

      # Fixed tag "erp-latest" so the download link never changes.
      # make_latest is false so the FB Claims app's own "latest" release is untouched.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: erp-latest
          name: FB ERP (latest)
          body: |
            FB ERP app, version 1.${{ github.run_number }}.

            Pehli dafa install:
            1. Neeche FB-ERP.apk par tap karein, download hogi.
            2. Download khol kar Install dabayein. Phone "unknown apps" ki ijazat maange to Allow karein.
            3. Play Protect ka message aaye to "More details" > "Install anyway" dabayein.

            Aage ke updates app ke andar "Update now" se hote hain. Data mehfooz rehta hai.

            FB-ERP-play.aab sirf Google Play Console mein upload karne ke liye hai (phone par install nahi hoti).
          files: |
            FB-ERP.apk
            FB-ERP-play.aab
            version.json
          overwrite_files: true
          make_latest: false
