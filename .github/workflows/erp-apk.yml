name: Build FB ERP APK

on:
  push:
    branches: [main]
    paths:
      - 'ERP/**'
      - '.github/workflows/erp-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the ERP page inside the app
        run: cp ERP/web/index.html ERP/android/app/src/main/assets/index.html

      - name: Build
        working-directory: ERP/android
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Rename
        run: cp ERP/android/app/build/outputs/apk/release/app-release.apk FB-ERP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FB-ERP-APK
          path: FB-ERP.apk

      # Fixed tag "erp-latest" so the download link never changes.
      # make_latest is false so the FB Claims app's own "latest" release is untouched.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: erp-latest
          name: FB ERP (latest)
          body: |
            FB ERP app, build ${{ github.run_number }}.
            Phone par neeche FB-ERP.apk download karke install karein.
          files: FB-ERP.apk
          make_latest: false
