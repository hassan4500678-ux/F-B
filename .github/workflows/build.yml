name: Build FB Claims APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        working-directory: ClaimsApp
        run: gradle assembleRelease --no-daemon -PvCode=${{ github.run_number }}

      - name: Rename
        run: cp ClaimsApp/app/build/outputs/apk/release/app-release.apk FB-Claims.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FB-Claims-APK
          path: FB-Claims.apk

      # The app checks this release to offer "Naya app update".
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FB Claims 1.${{ github.run_number }}
          body: |
            FB Claims app version 1.${{ github.run_number }}.
            Phone par neeche FB-Claims.apk download karke install karein.
          files: FB-Claims.apk
          make_latest: true
